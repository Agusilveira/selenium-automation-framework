name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testng:
    name: TestNG (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Correr la regresion
        env:
          TEST_ENV: ci
          BROWSER: ${{ matrix.browser }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suites/regression.xml

      - name: Publicar reporte y evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-${{ matrix.browser }}
          path: |
            reports/
            evidence/
          retention-days: 30
          if-no-files-found: ignore

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Sin navegador: 17 casos en segundos. Corre aparte para que un problema
      # de UI no tape un problema de API ni al reves.
      - name: Correr la suite de API
        env:
          TEST_ENV: ci
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suites/api.xml

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-api
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers levanta un Postgres real; los runners de GitHub traen
      # Docker. Con TEST_ENV=ci la base es obligatoria: si no se pudiera
      # levantar, la suite falla en vez de quedar en verde sin haber probado nada.
      - name: Correr la suite de base de datos
        env:
          TEST_ENV: ci
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suites/db.xml

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-db
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  grid:
    name: Selenium Grid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Levantar el Grid
        run: docker compose -f docker-compose.grid.yml up -d

      # El compose levanta los contenedores, pero los nodos tardan en registrarse
      # contra el hub. Correr sin esperar da un "no hay nodos disponibles" que
      # parece un fallo del framework y no lo es.
      - name: Esperar a que el Grid este listo
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/wd/hub/status | grep -q '"ready": *true'; then
              echo "Grid listo tras $i intento(s)"; exit 0
            fi
            sleep 5
          done
          echo "El Grid no quedo listo en 150 segundos"; docker compose -f docker-compose.grid.yml logs; exit 1

      - name: Correr el camino critico contra el Grid
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suites/grid.xml -Denv=grid

      - name: Bajar el Grid
        if: always()
        run: docker compose -f docker-compose.grid.yml down

      - name: Publicar reporte y video de sesion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-grid
          path: |
            reports/
            grid-videos/
          retention-days: 30
          if-no-files-found: ignore

  app-propia:
    name: Cruce entre capas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Levantar la aplicacion bajo prueba
        run: docker compose -f docker-compose.app.yml up -d

      # El compose espera a que los contenedores esten sanos, pero preparar-app.sh
      # necesita ademas que la aplicacion responda por HTTP: son dos cosas
      # distintas y saltearse la segunda da errores que parecen del framework.
      - name: Preparar usuario, token y datos
        run: ./scripts/preparar-app.sh

      - name: Correr el cruce entre capas
        env:
          TEST_ENV: app
        run: mvn -B test -DsuiteXmlFile=src/test/resources/suites/app.xml -Denv=app

      - name: Bajar la aplicacion
        if: always()
        run: docker compose -f docker-compose.app.yml down -v

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-app
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  cucumber:
    name: Cucumber
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Correr los features
        env:
          TEST_ENV: ci
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}
        run: mvn -B test -Pcucumber

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  publicar-reporte:
    needs: testng
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el reporte de Chrome
        uses: actions/download-artifact@v4
        with:
          name: reporte-chrome
          path: site

      # El artefacto sube reports/ y evidence/, asi que conserva esa estructura:
      # el HTML queda en site/reports/, no en la raiz de site/.
      - name: Dejar el reporte como index
        run: |
          mv site/reports/ExtentReport.html site/index.html
          rm -rf site/reports

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
