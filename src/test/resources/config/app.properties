# Perfil de la aplicacion bajo prueba propia: Gitea con sus tres caras
# accesibles. Es el unico perfil donde la UI, la API y la base son del mismo
# sistema, que es lo que permite cruzarlas.
#
# Levantar con:
#   docker compose -f docker-compose.app.yml up -d && ./scripts/preparar-app.sh

base.url=http://localhost:3000
api.base.url=http://localhost:3000/api/v1
browser=chrome
headless=true
target=LOCAL
grid.url=http://localhost:4444
page.load.timeout=30
explicit.timeout=15
retry.count=0

app.usuario=tester
app.password=Framework2026!
app.repo=framework-demo

# El token lo genera preparar-app.sh y se lee de .app-token, que no se versiona.
# Una credencial en un archivo del repositorio es una credencial filtrada, aunque
# sea de una aplicacion local.

db.url=jdbc:postgresql://localhost:5433/gitea
db.user=gitea
db.password=gitea
db.pool.size=5
db.timeout=15
db.requerida=true

webui.fallback.js.enabled=true
webui.fallback.js.max=10
widgets.url=https://the-internet.herokuapp.com
