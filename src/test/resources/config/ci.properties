# Configuracion del framework para el pipeline. Los datos de la aplicacion
# llegan como variables de CI enmascaradas: BASE_URL, API_BASE_URL, etc.
browser=chrome
headless=true
target=LOCAL
grid.url=http://localhost:4444/wd/hub
page.load.timeout=30
explicit.timeout=15
retry.count=1
webui.fallback.js.enabled=true
webui.fallback.js.max=15
api.timeout=30
