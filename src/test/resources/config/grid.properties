# Perfil para correr contra el Selenium Grid del docker-compose.
# Los navegadores viven en contenedores, asi que headless no aplica del
# mismo modo: el nodo ya corre sin pantalla real.
base.url=https://www.saucedemo.com
browser=chrome
headless=true
target=GRID
grid.url=http://localhost:4444
page.load.timeout=30
explicit.timeout=15
retry.count=0
sauce.password=secret_sauce
webui.fallback.js.enabled=true
webui.fallback.js.max=10
widgets.url=https://the-internet.herokuapp.com
api.base.url=https://dummyjson.com
api.timeout=20
api.usuario=emilys
api.password=emilyspass
db.pool.size=5
db.timeout=15
db.requerida=false
