# Configuracion del framework para correr en una maquina de desarrollo.
#
# No hay URLs ni datos de ninguna aplicacion: esos van en un perfil privado,
# config/<nombre>-privado.properties, que git ignora. Se elige con -Denv o
# TEST_ENV. Las credenciales, ni siquiera ahi: solo por variable de entorno.
browser=chrome
headless=false
target=LOCAL
grid.url=http://localhost:4444/wd/hub
page.load.timeout=30
explicit.timeout=15
retry.count=0
webui.fallback.js.enabled=true
webui.fallback.js.max=10
api.timeout=20
