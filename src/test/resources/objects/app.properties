# Locators de la aplicacion propia (Gitea).
app.login.usuario=id:user_name
app.login.password=id:password
app.login.boton=css:button.ui.primary.button.tw-w-full
app.login.error=css:.flash-error

app.nav.avatar=css:#navbar .item[data-tooltip-content='Perfil y configuracion']
app.nav.dashboard=css:a[href='/']

app.repo.titulo=css:.repo-title a[href*='framework-demo']
app.repo.pestanaIssues=css:a[href$='/issues']

app.issues.lista=css:.page-content.issue-list
app.issues.titulos=css:a.list-item-large-title
app.issues.nuevo=css:a[href$='/issues/new']
app.issues.campoTitulo=id:issue_title
app.issues.campoCuerpo=css:textarea[name='content']
app.issues.botonCrear=css:button.ui.primary.button
app.issues.tituloDetalle=css:#issue-title-display h1
# La pestaña "N Open" del listado: es el total que la propia interfaz declara,
# independiente de cuantos entren en la pagina que se esta viendo.
app.issues.contadorAbiertos=css:a.flex-text-inline[href*='state=all']
