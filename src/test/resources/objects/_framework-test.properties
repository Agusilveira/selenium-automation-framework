# Locators de los tests unitarios de PropertiesHelper y LocatorHelper.
#
# Viven aparte de los de cualquier proyecto para que corregir un selector real
# no rompa un test del framework. El prefijo evita choques: objects/ se lee
# entero como un solo espacio de claves.
test.boton=css:[data-test='login-button']
test.agregar=css:[data-test='add-to-cart-{0}']
